[project]
name = "strands-aidr"
version = "0.1.0"
description = "CrowdStrike AIDR integration for the Strands Agents SDK"
readme = "README.md"
license = "MIT"
authors = [
    { name = "CrowdStrike", email = "support@crowdstrike.com" },
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.12"
dependencies = [
    "crowdstrike-aidr>=0.4",
    "strands-agents>=0.1",
]

[project.urls]
"Source Code" = "https://github.com/CrowdStrike/strands-aidr"
"Release Notes" = "https://github.com/CrowdStrike/strands-aidr/releases"

[project.optional-dependencies]
dev = [
    "mypy==1.19.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_aidr"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
color_output = true
error_summary = true
implicit_reexport = false
pretty = true
show_column_numbers = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--tb=short"
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
